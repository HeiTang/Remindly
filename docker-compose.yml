services:
  remindly:
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    image: remindly:local
    container_name: remindly
    init: true
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN in .env or Portainer stack env}
      BOT_USERNAME: ${BOT_USERNAME:-}
      DATABASE_PATH: /app/data/reminders.db
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Asia/Taipei}
      POLL_TIMEOUT_SECONDS: ${POLL_TIMEOUT_SECONDS:-25}
      SCHEDULER_INTERVAL_SECONDS: ${SCHEDULER_INTERVAL_SECONDS:-10}
      DRAFT_TTL_MINUTES: ${DRAFT_TTL_MINUTES:-10}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AI_ENCRYPTION_KEY: ${AI_ENCRYPTION_KEY:-}
    volumes:
      - remindly-data:/app/data
    restart: unless-stopped
    stop_grace_period: 15s

  remindly-admin:
    profiles: [admin]
    image: remindly:local
    pull_policy: never
    init: true
    depends_on:
      - remindly
    command: ["gunicorn", "--bind", "0.0.0.0:8081", "remindly.admin:create_app()"]
    environment:
      DATABASE_PATH: /app/data/reminders.db
      ADMIN_DATABASE_PATH: /app/admin/access.db
      ADMIN_TELEGRAM_IDS: ${ADMIN_TELEGRAM_IDS:-}
      ADMIN_TELEGRAM_CLIENT_ID: ${ADMIN_TELEGRAM_CLIENT_ID:-}
      ADMIN_TELEGRAM_CLIENT_SECRET: ${ADMIN_TELEGRAM_CLIENT_SECRET:-}
      ADMIN_TELEGRAM_REDIRECT_URI: ${ADMIN_TELEGRAM_REDIRECT_URI:-}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
    volumes:
      - remindly-data:/app/data:ro
      - remindly-admin-data:/app/admin
    ports:
      - "127.0.0.1:8081:8081"
    restart: unless-stopped

volumes:
  remindly-admin-data:
    name: remindly-admin-data
  remindly-data:
    name: remindly-data
