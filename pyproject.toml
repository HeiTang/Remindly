[project]
name = "remindly"
version = "0.6.0"
description = "Remindly"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "authlib>=1.7,<2",
    "cryptography>=46,<47",
    "flask>=3.1,<4",
    "gunicorn>=23,<27",
    "joserfc>=1.6,<2",
    "requests>=2.32.4,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
remindly = "remindly.app:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[dependency-groups]
dev = [
    "ruff>=0.15.10",
]
